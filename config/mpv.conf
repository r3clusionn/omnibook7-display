# Picture first. X runs at depth 30, so gpu-next on Vulkan renders and dithers
# to 10 bits per channel; colormode converts the colours for the panel.
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi
profile=high-quality
# The Vulkan swapchain is 10-bit at depth 30 (A2R10G10B10), but mpv's "auto"
# assumes 8 there; at X depth 24 set this back to auto.
dither-depth=10
# Frames timed to the panel's 120 Hz: 23.976 and 59.94 fps play without a
# repeated or dropped frame every few seconds.
video-sync=display-resample
# OLED: true black level for HDR->SDR tone mapping (batch 16)
target-contrast=inf
# HDR: `colormode watch` switches the screen to HDR while an HDR video is
# fullscreen and on screen (Alt+number away and it is SDR again). This plugin
# tells it about the video and renders PQ meanwhile (target-trc=pq,
# target-prim=bt.2020, target-peak = the panel's, target-colorspace-hint=no),
# then puts those options back.
script=/usr/local/lib/colormode-hdr.so
# 10 bits per channel in mpv's own DRM output too (default xrgb8888).
drm-format=xrgb2101010

[hdr-console]
profile-desc=HDR from a text console, X on another VT: mpv --profile=hdr-console FILE
# mpv drives the panel and sends the HDR metadata itself (and SDR metadata when
# it quits). The colour tables X set stay on: `colormode native` in X before,
# `colormode srgb` after.
gpu-context=drm
gpu-api=opengl
target-colorspace-hint=yes
